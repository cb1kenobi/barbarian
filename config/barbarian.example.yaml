version: 1

profile:
  name: Developer
  timezone: America/Chicago
  githubLogin: ""

appearance:
  theme: dark
  fontSize: normal

monitor:
  intervalMinutes: 20
  runOnStartup: true
  includeDraftPullRequests: false

repositories: []
# Example:
# repositories:
#   - name: your-org/important-storage-repo
#     priority: 100
#     watchIssues: true
#     watchPullRequests: true
#     reviewSkill: cb1-code-review
#     labels:
#       data-loss: 100
#       security: 80

review:
  requestedReviewer: ""
  fallbackTeams: []
  workspaceRoot: .barbarian/workspaces
  autoCleanup: true

linear:
  enabled: false
  command: []

agents:
  default: codex
  autoReview: false
  maxConcurrent: 2
  maxAutomaticAttempts: 3
  retryBaseMinutes: 5
  maxRunsPerPullRequestPerHour: 3
  providers:
    codex:
      command: codex
      args: [exec, --sandbox, read-only, --skip-git-repo-check, "-"]
    claude:
      command: claude
      args: [-p]
    gemini:
      command: gemini
      args: []

statusUpdate:
  enabled: true
  workdays: [monday, tuesday, wednesday, thursday, friday]
  daysOff: []
