version: 1

server:
  bindAddress: 127.0.0.1
  port: 4142
  trustedHosts: []

desktop:
  launchAtLogin: false
  globalShortcut: CommandOrControl+Shift+Space

profile:
  name: Developer
  reviewName: ""
  timezone: America/Chicago
  githubLogin: ""

appearance:
  theme: dark
  fontSize: normal
  weapon: double-axe

monitor:
  intervalMinutes: 20
  runOnStartup: true

repositories: []
# Example:
# repositories:
#   - name: your-org/important-storage-repo
#     priority: 100
#     watchIssues: true
#     watchPullRequests: true
#     reviewSkill: cb1-code-review
#     labels:
#       data-loss: 100
#       security: 80

review:
  requestedReviewer: ""
  fallbackTeams: []
  workspaceRoot: .barbarian/workspaces
  autoCleanup: true

linear:
  enabled: false
  command: []

agents:
  codeReview: []
  reviewRouting: round_robin
  usageHeadroomPercent: 20
  chat:
    provider: codex
    model: ""
    effort: ""
  autoReview: false
  maxConcurrent: 2
  maxAutomaticAttempts: 3
  retryBaseMinutes: 5
  maxRunsPerPullRequestPerHour: 3
  providers:
    codex:
      command: codex
      args: [exec, --sandbox, read-only, --skip-git-repo-check, "-"]
    claude:
      command: claude
      args: [-p]
    # Add another Claude account by generating a token with `claude setup-token`,
    # saving it in .env, then defining another named provider instance:
    # claude-secondary:
    #   command: claude
    #   args: [-p]
    #   env:
    #     CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_SECONDARY_OAUTH_TOKEN}
    gemini:
      command: gemini
      args: []
    cursor:
      command: cursor-agent
      args: [-p, --mode, ask, --output-format, text]

statusUpdate:
  enabled: true
  workdays: [monday, tuesday, wednesday, thursday, friday]
  daysOff: []
